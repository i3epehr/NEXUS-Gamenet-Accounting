<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C16" />
      <stop offset="50%" stop-color="#0B1325" />
      <stop offset="100%" stop-color="#111E38" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#2596BE" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Primary Neon Cyan Gradient -->
    <linearGradient id="nexusCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#2596BE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Accent Violet Gradient -->
    <linearGradient id="nexusViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00F0FF" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle Container (macOS / Android standard 512x512) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#cardShadow)" />

  <!-- Inner Cyber Grid Accent Rings -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#2596BE" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="16 12" />

  <!-- Cyber Corner Accents -->
  <path d="M 64 120 L 64 64 L 120 64" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M 448 120 L 448 64 L 392 64" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M 64 392 L 64 448 L 120 448" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M 448 392 L 448 448 L 392 448" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Shield / Gamepad Silhouette (Integrated Cyber GameNet Emblem) -->
  <g transform="translate(0, 0)">
    <!-- Controller Wings Aura -->
    <path d="M 140 180 C 180 150 332 150 372 180 C 410 210 420 310 376 348 C 348 372 316 340 290 310 C 270 286 242 286 222 310 C 196 340 164 372 136 348 C 92 310 102 210 140 180 Z"
          fill="#111E38" stroke="url(#nexusCyan)" stroke-width="4" stroke-opacity="0.5" />

    <!-- Center Futuristic "N" Monogram -->
    <!-- Left Pillar -->
    <path d="M 152 144 L 204 144 L 204 368 L 152 368 Z" fill="url(#nexusCyan)" filter="url(#neonGlow)" />
    <!-- Angular Cross Bar -->
    <path d="M 196 144 L 316 332 L 316 368 L 260 368 L 152 196 L 152 144 Z" fill="url(#nexusCyan)" filter="url(#neonGlow)" opacity="0.95" />
    <!-- Right Pillar -->
    <path d="M 308 144 L 360 144 L 360 368 L 308 368 Z" fill="url(#nexusCyan)" filter="url(#neonGlow)" />

    <!-- Stylized Gamepad Elements Embedded into N -->
    <!-- D-Pad Plus on Left -->
    <g transform="translate(112, 240)" opacity="0.85">
      <rect x="-6" y="-18" width="12" height="36" rx="4" fill="#67E8F9" />
      <rect x="-18" y="-6" width="36" height="12" rx="4" fill="#67E8F9" />
      <circle cx="0" cy="0" r="3" fill="#0B1325" />
    </g>

    <!-- Action Buttons Diamond on Right -->
    <g transform="translate(400, 240)" opacity="0.85">
      <circle cx="0" cy="-14" r="5" fill="#00F0FF" />
      <circle cx="14" cy="0" r="5" fill="#8B5CF6" />
      <circle cx="0" cy="14" r="5" fill="#3B82F6" />
      <circle cx="-14" cy="0" r="5" fill="#10B981" />
    </g>

    <!-- Central Glowing Core / Power Orb -->
    <circle cx="256" cy="256" r="14" fill="#00F0FF" filter="url(#neonGlow)" />
    <circle cx="256" cy="256" r="7" fill="#FFFFFF" />

    <!-- Top Crown Light Arc -->
    <path d="M 216 116 Q 256 100 296 116" fill="none" stroke="#00F0FF" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Bottom Tech Sub-Badge -->
    <rect x="206" y="396" width="100" height="18" rx="9" fill="#1E293B" stroke="#2596BE" stroke-width="2" />
    <circle cx="230" cy="405" r="3" fill="#10B981" />
    <circle cx="256" cy="405" r="3" fill="#00F0FF" />
    <circle cx="282" cy="405" r="3" fill="#8B5CF6" />
  </g>
</svg>
